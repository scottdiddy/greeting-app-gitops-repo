
# Specifies the Kubernetes API version for the Argo CD Application resource.
#
# argoproj.io is the API group introduced by Argo CD.
# v1alpha1 is the API version of the Application Custom Resource Definition (CRD).
#
# Unlike built-in Kubernetes resources such as Deployments and Services,
# Application is a custom resource installed when Argo CD is installed.
apiVersion: argoproj.io/v1alpha1

# The type of Kubernetes resource we are creating.
# Here, we are creating an Argo CD Application.
kind: Application

# Metadata identifies this Application resource inside Kubernetes.
metadata:

  # Name of the Argo CD Application.
  # This is the name you'll see in the Argo CD dashboard.
  #
  # It is NOT necessarily the Helm release name or Deployment name.
  name: greeting-app-on-dev-cluster

  # Namespace where the Argo CD Application resource itself lives.
  #
  # Since Argo CD is installed in the "argocd" namespace,
  # we place this Application resource there.
  #
  # This is DIFFERENT from the namespace where the greeting
  # application will actually be deployed.
  namespace: argocd

# The desired configuration of the Argo CD Application.
spec:

  # The Argo CD Project this Application belongs to.
  #
  # Projects group applications and control which Git repositories,
  # Kubernetes clusters, and namespaces applications can use.
  #
  # "default" is the default Argo CD project.
  project: default

  # Describes WHERE Argo CD should obtain the application manifests.
  source:

    # Git repository containing our Helm chart.
    #
    # Argo CD fetches this repository to discover the chart and
    # generate the Kubernetes manifests.
    repoURL: https://github.com/scottdiddy/greeting-app-gitops-repo.git

    # Git branch, tag, or commit to track.
    #
    # "main" means Argo CD tracks the main branch.
    # When new commits reach main, Argo CD can detect the changes.
    targetRevision: main

    # Path to the Helm chart inside the Git repository.
    #
    # Argo CD looks inside:
    #
    # greeting-app-gitops-repo/
    #   charts/
    #     greeting-app-chart/
    #       Chart.yaml
    #       values.yaml
    #       values-for-dev.yaml
    #       templates/
    #
    # Argo CD detects the Helm chart from Chart.yaml
    # and uses its templates to generate Kubernetes resources.
    path: charts/greeting-app-chart

    # Helm-specific rendering configuration.
    helm:

      # The Helm release name used while rendering the chart.
      #
      # Similar to the release name in:
      # helm template greeting-app charts/greeting-app-chart
      #
      # Note: Argo CD uses Helm mainly to render manifests.
      # Argo CD manages the actual deployment lifecycle.
      releaseName: greeting-app

      # Additional Helm values files to load.
      #
      # Helm automatically reads values.yaml from the chart.
      # values-for-dev.yaml overrides matching default values.
      #
      # The path is relative to the chart directory specified above.
      valueFiles:
        - values-for-dev.yaml

  # Describes WHERE Argo CD should deploy the generated resources.
  destination:

    # Kubernetes API server address of the destination cluster.
    #
    # https://kubernetes.default.svc refers to the Kubernetes
    # cluster Argo CD itself runs in.
    #
    # If Argo CD is installed in kind-greeting-dev-cluster,
    # this targets that same cluster.
    #
    # To deploy to a different cluster, it must first be
    # registered with Argo CD and permitted by the project.
    server: https://kubernetes.default.svc

    # Kubernetes namespace where the greeting application
    # resources should be deployed.
    #
    # This is NOT the namespace of the Argo CD Application CR.
    #
    # For example, the Deployment and Service generated by
    # the chart will normally be created in this namespace.
    namespace: greeting-app-namespace

  # Defines how Argo CD synchronizes Git with Kubernetes.
  syncPolicy:

    # Enables automatic synchronization.
    #
    # Argo CD can automatically apply changes from Git
    # without you manually running kubectl apply or helm upgrade.
    automated:

      # Automatically delete managed Kubernetes resources
      # that were removed from the desired manifests in Git.
      #
      # Example:
      # If service.yaml is removed from the chart, and that
      # Service is no longer generated, Argo CD can delete
      # the previously managed Service from Kubernetes.
      #
      # Be careful with this option in production.
      prune: true

      # Automatically correct configuration drift.
      #
      # Example:
      # Git says replicas = 2.
      # Someone manually changes the Deployment to replicas = 5.
      #
      # Argo CD detects the difference and restores replicas = 2.
      selfHeal: true

    # Additional options affecting the synchronization process.
    syncOptions:

      # Automatically create greeting-app-namespace if it
      # does not already exist in the destination cluster.
      #
      # Similar in purpose to:
      # helm install ... --create-namespace
      - CreateNamespace=true
